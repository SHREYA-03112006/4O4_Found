services:
  - type: web
    name: 4o4-found-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    rootDir: backend
    envVars:
      - key: DEV_MODE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: HF_API_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: 4o4-found-db
          property: connectionString

databases:
  - name: 4o4-found-db
    plan: free
    databaseName: four_zero_four_found
    user: db_user
